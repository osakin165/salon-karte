<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>Salon de SOAN — 電子カルテ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#c8c5be;min-height:100vh;-webkit-tap-highlight-color:transparent}

/* ===== NAV ===== */
.nav{background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;height:52px;position:fixed;top:0;left:0;right:0;z-index:300}
.nav-title{font-size:13px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.nav-sep{flex:1}
.nb{padding:6px 11px;border-radius:7px;border:1px solid #555;background:transparent;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.nb:active{background:#333}
.nb.pri{background:#fff;color:#1a1a1a;border-color:#fff;font-weight:700}
.nb.sync{background:#1a6fa8;border-color:#1a6fa8;color:#fff}

/* ===== TOOLBAR ===== */
.toolbar{background:#222;display:flex;align-items:center;gap:6px;padding:0 12px;height:46px;position:fixed;top:52px;left:0;right:0;z-index:290;overflow-x:auto;-webkit-overflow-scrolling:touch}
.toolbar::-webkit-scrollbar{display:none}
.cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0}
.cdot.on{border-color:#fff}
.tbtn{padding:5px 10px;border-radius:14px;border:1px solid #555;background:transparent;color:#aaa;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.tbtn.on{background:#fff;color:#111;border-color:#fff;font-weight:700}
.tb-sep{width:1px;height:22px;background:#444;flex-shrink:0;margin:0 2px}

/* ===== CUSTBAR ===== */
.custbar{background:#efece7;border-bottom:1px solid #c5c1b8;padding:0 12px;height:44px;display:flex;align-items:center;gap:8px;position:fixed;top:98px;left:0;right:0;z-index:280;overflow-x:auto;-webkit-overflow-scrolling:touch}
.custbar::-webkit-scrollbar{display:none}
.sq{padding:6px 11px;border:1px solid #bbb;border-radius:16px;font-size:13px;font-family:inherit;outline:none;background:#fff;flex-shrink:0;width:150px}
.cpill{padding:5px 13px;border-radius:16px;border:1px solid #ccc;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cpill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.cpill.alg{border-color:#c0392b;color:#c0392b}
.cpill.on.alg{background:#c0392b;color:#fff;border-color:#c0392b}

/* ===== MAIN ===== */
.main{margin-top:142px;padding:12px;display:flex;flex-direction:column;gap:14px}

/* ===== KARTE PAGES ===== */
.kpage{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.2);overflow:hidden}
.kpage-hdr{background:#333;color:#fff;font-size:11px;font-weight:700;padding:5px 12px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.04em}
.kpage-btns{display:flex;gap:6px}
.kpbtn{padding:3px 9px;border-radius:10px;border:1px solid #666;background:transparent;color:#ccc;font-size:10px;cursor:pointer;font-family:inherit}

/* ===== PAGE LAYOUT ===== */
/* Page1上段: 左=基本情報, 右=施術①(大) */
.p1-top{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #999}
/* Page1下段: 施術②③ */
.p1-bot{display:grid;grid-template-columns:1fr 1fr}
/* Page2上段: 左=施術④, 右=来店履歴 */
.p2-top{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #999}
/* Page2下段: 左=施術⑤, 右=メモ */
.p2-bot{display:grid;grid-template-columns:1fr 1fr}

.cell{padding:10px 12px;border-right:1px solid #aaa}
.cell:last-child{border-right:none}
.cell.no-pad{padding:0}

/* ===== 基本情報 ===== */
.karte-main-title{font-size:13px;font-weight:700;letter-spacing:.25em;text-align:center;padding:6px 0 8px;border-bottom:2px solid #1a1a1a;margin-bottom:8px}
.info-row{display:flex;align-items:baseline;border-bottom:1px solid #ddd;padding:4px 0;gap:4px}
.info-label{font-size:10px;color:#666;min-width:58px;flex-shrink:0}
.info-input{flex:1;border:none;outline:none;font-size:12px;font-family:inherit;background:transparent;color:#1a1a1a;min-height:18px}

/* 体質テーブル */
.shitsu-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:10px}
.shitsu-table td{border:1px solid #aaa;padding:3px 4px;vertical-align:middle}
.shitsu-table .th{background:#444;color:#fff;font-weight:700;text-align:center;white-space:nowrap;width:52px}
.shitsu-table .th2{background:#222;color:#fff;font-weight:700;text-align:center;white-space:nowrap;width:52px}
.radio-row{display:flex;gap:5px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:10px;white-space:nowrap}
.radio-row input[type=radio]{width:11px;height:11px}
.check-row{display:flex;gap:5px;flex-wrap:wrap}
.check-row label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:11px;font-weight:700}
.check-row input[type=checkbox]{width:12px;height:12px}

/* ===== 施術記録 ===== */
.visit-block{height:100%}
.visit-date-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #ddd}
.visit-date-label{font-size:9px;color:#888}
.visit-date-input{border:none;border-bottom:1px solid #ccc;outline:none;font-size:12px;font-weight:700;font-family:inherit;width:100px;text-align:right;background:transparent}

/* SCHPTB チェック行 */
.schptb{display:flex;border:1px solid #aaa;border-radius:2px;overflow:hidden;margin-bottom:6px}
.schptb-cell{flex:1;text-align:center;border-right:1px solid #aaa;padding:3px 0}
.schptb-cell:last-child{border-right:none}
.schptb-cell label{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:11px;font-weight:700}
.schptb-cell input[type=checkbox]{width:12px;height:12px}

/* 施術テーブル */
.vtable{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:5px}
.vtable td{border:1px solid #ccc;padding:3px 4px;vertical-align:middle}
.vtable .vlbl{background:#f0ede8;font-weight:700;white-space:nowrap;width:64px}
.vtable input,.vtable select{width:100%;border:none;outline:none;font-size:10px;font-family:inherit;background:transparent}
.vtable .r-group{display:flex;gap:4px;flex-wrap:wrap}
.vtable .r-group label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:10px;white-space:nowrap}
.vtable .r-group input[type=radio]{width:10px;height:10px}

/* メモエリア */
.memo-area{width:100%;border:1px solid #ddd;border-radius:3px;font-size:11px;font-family:inherit;padding:5px;resize:vertical;outline:none;min-height:50px}

/* 頭部イラスト */
.heads-col{display:flex;flex-direction:column;gap:4px;align-items:center;padding:4px;border-left:1px solid #ddd}
.head-wrap{position:relative;border:1px solid #e0e0e0;border-radius:3px;overflow:hidden;touch-action:none;background:#fff;flex-shrink:0}
.head-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;z-index:2}
.head-wrap img.headimg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:1} .head-wrap canvas{z-index:2}
.head-lbl{font-size:9px;color:#aaa;text-align:center}

/* ===== 来店履歴テーブル ===== */
.history-wrap{padding:8px}
.history-title{font-size:10px;font-weight:700;color:#555;margin-bottom:5px;letter-spacing:.05em}
.htable{width:100%;border-collapse:collapse;font-size:9px}
.htable th{background:#555;color:#fff;padding:3px 2px;text-align:center;border:1px solid #aaa}
.htable td{border:1px solid #ccc;padding:2px 3px;height:20px}
.htable td input{width:100%;border:none;outline:none;font-size:9px;font-family:inherit;background:transparent;text-align:center}
.htable .hcheck{display:flex;justify-content:center;gap:1px}
.htable .hcheck label{display:flex;align-items:center;gap:0px;font-size:8px;cursor:pointer}
.htable .hcheck input[type=checkbox]{width:9px;height:9px}

/* ===== メモ欄 ===== */
.memo-wrap{padding:8px}
.memo-title{font-size:10px;font-weight:700;color:#555;margin-bottom:5px;letter-spacing:.05em}
.memo-lines{display:flex;flex-direction:column;gap:0}
.memo-line{border-bottom:1px solid #ccc;min-height:28px;width:100%;border-left:none;border-right:none;border-top:none;outline:none;font-size:12px;font-family:inherit;padding:4px 2px;resize:none}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:12px;padding:8px 18px;border-radius:20px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ===== EMPTY ===== */
.empty{padding:60px 20px;text-align:center;color:#aaa;font-size:14px;line-height:2.2}

/* ===== MODAL ===== */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.md{background:#fff;border-radius:14px;width:100%;max-width:440px;padding:20px;max-height:90vh;overflow-y:auto}
.md h2{font-size:16px;font-weight:700;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.fc{grid-column:1/-1}
.fl{font-size:11px;color:#888;margin-bottom:3px;display:block}
.fi{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:7px;font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none}
.fi:focus{border-color:#888}
.ma{display:flex;gap:8px;margin-top:14px}
.bc{flex:1;padding:11px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.bs{flex:2;padding:11px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}

/* ===== SETUP ===== */
.setup-box{background:#fff;border-radius:10px;padding:20px;max-width:500px;margin:10px auto;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.setup-box h3{font-size:15px;font-weight:700;margin-bottom:10px}
.step{display:flex;gap:8px;margin-bottom:8px;font-size:12px;color:#444;line-height:1.6}
.step-num{background:#1a1a1a;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.hint{background:#fffbe6;border:1px solid #e8d050;border-radius:8px;padding:10px 14px;font-size:12px;color:#666;line-height:1.7;margin-bottom:10px}

@media(max-width:600px){
  .p1-top,.p1-bot,.p2-top,.p2-bot{grid-template-columns:1fr}
  .cell{border-right:none;border-bottom:1px solid #aaa}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">✦ Salon de SOAN｜電子カルテ</div>
  <div class="nav-sep"></div>
  <button class="nb sync" id="btn-sync" onclick="syncNow()" style="display:none">☁ 同期</button>
  <button class="nb pri" onclick="openNewCust()" id="btn-newcust" style="display:none">＋新規顧客</button>
  <button class="nb pri" onclick="showSetup()" id="btn-setup">⚙ 初期設定</button>
</div>

<div class="toolbar" id="toolbar" style="display:none">
  <span style="font-size:10px;color:#777;flex-shrink:0">ペン</span>
  <div class="cdot on" style="background:#111" data-c="#111" onclick="setC(this)"></div>
  <div class="cdot" style="background:#c0392b" data-c="#c0392b" onclick="setC(this)"></div>
  <div class="cdot" style="background:#1a6fa8" data-c="#1a6fa8" onclick="setC(this)"></div>
  <div class="cdot" style="background:#1e8449" data-c="#1e8449" onclick="setC(this)"></div>
  <div class="cdot" style="background:#d68910" data-c="#d68910" onclick="setC(this)"></div>
  <div class="cdot" style="background:#7d3c98" data-c="#7d3c98" onclick="setC(this)"></div>
  <div class="tb-sep"></div>
  <button class="tbtn" id="btn-er" onclick="toggleEr()">消しゴム</button>
  <div class="tb-sep"></div>
  <span style="font-size:10px;color:#777;flex-shrink:0">太さ</span>
  <input type="range" min="1" max="20" value="2" step="1" oninput="pSz=+this.value" style="width:70px;flex-shrink:0;accent-color:#fff;cursor:pointer">
  <div class="tb-sep"></div>
  <button class="tbtn" onclick="doUndo()">↩ 戻す</button>
  <button class="tbtn" onclick="doClear()">🗑 クリア</button>
  <div class="tb-sep"></div>
  <span style="font-size:10px;color:#5a5;flex-shrink:0" id="active-label">頭の絵をタップして描く</span>
</div>

<div class="custbar" id="custbar" style="display:none">
  <input class="sq" type="text" id="sq" placeholder="🔍 名前・電話で検索" oninput="doSearch()">
  <div id="pills" style="display:flex;gap:6px"></div>
</div>

<div class="main" id="main">
  <div id="setup-area"></div>
  <div class="empty" id="empty" style="display:none">
    ✦<br>顧客を選択するか、新規顧客を登録してください<br>
    <button class="nb pri" onclick="openNewCust()" style="margin-top:14px;padding:10px 20px;font-size:13px">＋ 新規顧客登録</button>
  </div>
  <div id="karea" style="display:none;flex-direction:column;gap:14px"></div>
</div>

<div class="toast" id="toast"></div>
<div id="mroot"></div>

<script>
// ===== CONFIG =====
const GAS_KEY = 'soan_gas_url_v3';
let GAS_URL = localStorage.getItem(GAS_KEY) || '';

// ===== STATE =====
let pColor='#111', pSz=2, erasing=false;
let curId=null, activeCvInfo=null;
let db={customers:[], nid:1};
let syncTimer=null;
let canvasRegistry={};

// ===== TOAST =====
function toast(msg,dur=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),dur);
}

// ===== CLOUD =====
async function gasReq(action,payload={}){
  if(!GAS_URL)return null;
  try{
    const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action,...payload})});
    return await res.json();
  }catch(e){return null;}
}
async function loadCloud(){
  toast('☁ 読み込み中...',4000);
  const res=await gasReq('load');
  if(res&&res.ok&&res.data){db=res.data;toast('✅ クラウドから読み込みました');}
  else{loadLocal();toast('⚠ ローカルデータを使用中');}
  renderPills();
}
async function saveCloud(){
  saveLocal();
  if(!GAS_URL)return;
  const res=await gasReq('save',{data:db});
  if(res&&res.ok)toast('✅ クラウドに保存しました');
  else toast('⚠ クラウド保存失敗（ローカル保存済み）');
}
function scheduleSave(){clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,2000);}
function syncNow(){saveCloud();}
function saveLocal(){
  try{
    const slim={...db,customers:db.customers.map(c=>({...c,
      visits:c.visits.map(v=>({...v,inkF:'',inkS:'',inkB:'',history:[]}))}))};
    localStorage.setItem('soan_v3',JSON.stringify(slim));
  }catch(e){}
}
function loadLocal(){
  try{const s=localStorage.getItem('soan_v3');if(s)db=JSON.parse(s);}catch(e){}
}

// ===== HELPERS =====
function gc(id){return db.customers.find(c=>c.id===id);}
function gv(c,vid){return c.visits.find(v=>v.id===vid);}
function today(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function mkVid(){return Date.now();}

// ===== SEARCH =====
function doSearch(){renderPills(document.getElementById('sq').value.trim().toLowerCase());}
function renderPills(q=''){
  let list=db.customers;
  if(q)list=list.filter(c=>c.name.toLowerCase().includes(q)||(c.tel||'').replace(/-/g,'').includes(q.replace(/-/g,'')));
  document.getElementById('pills').innerHTML=list.map(c=>
    `<span class="cpill${c.id===curId?' on':''}${c.allergy?' alg':''}" onclick="selCust(${c.id})">${c.name}</span>`
  ).join('');
}

// ===== SELECT =====
function selCust(id){
  curId=id;activeCvInfo=null;canvasRegistry={};
  renderPills(document.getElementById('sq').value.trim().toLowerCase());
  renderKarte();
}

// ===== RENDER VISIT BLOCK =====
function renderVisitBlock(c, v, size){
  const hw = size==='lg' ? 62 : 52;
  const hh = size==='lg' ? 82 : 68;
  const vid = v.id;
  const fid=`cv-${vid}-f`, sid=`cv-${vid}-s`, bid=`cv-${vid}-b`;
  canvasRegistry[fid]={vid,part:'inkF',ink:v.inkF||''};
  canvasRegistry[sid]={vid,part:'inkS',ink:v.inkS||''};
  canvasRegistry[bid]={vid,part:'inkB',ink:v.inkB||''};

  return `<div class="visit-block">
  <div class="visit-date-row">
    <span class="visit-date-label">年　月　日</span>
    <input class="visit-date-input" value="${v.date||''}" placeholder="${today()}" onchange="saveV(${c.id},${vid},'date',this.value)">
  </div>
  <div class="schptb">
    ${['S','C','H','P','T','B'].map(m=>`<div class="schptb-cell"><label><input type="checkbox" ${v.menu&&v.menu[m]?'checked':''} onchange="saveVMenu(${c.id},${vid},'${m}',this.checked)">${m}</label></div>`).join('')}
    <div class="schptb-cell" style="flex:1.5"><span style="font-size:9px;color:#aaa">薬液指定</span></div>
    <div class="schptb-cell" style="flex:1.5"><span style="font-size:9px;color:#aaa"></span></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr ${hw+8}px;gap:4px">
    <div>
      <table class="vtable">
        <tr><td class="vlbl">長　さ</td><td>
          <div class="r-group">${['L','SL','S'].map(l=>`<label><input type="radio" name="len-${vid}" value="${l}" ${v.len===l?'checked':''} onchange="saveV(${c.id},${vid},'len',this.value)"> ${l}</label>`).join('')}</div>
        </td></tr>
        <tr><td class="vlbl">店販</td><td><input value="${v.retail||''}" onchange="saveV(${c.id},${vid},'retail',this.value)" placeholder="商品名"></td></tr>
        <tr><td class="vlbl">料　金</td><td>¥<input type="number" value="${v.price||''}" onchange="saveV(${c.id},${vid},'price',this.value)" style="width:calc(100% - 14px)"></td></tr>
        <tr><td class="vlbl">ダメージ</td><td>
          <div class="r-group">${['全体','毛先','枝毛','無'].map(d=>`<label><input type="radio" name="dmg-${vid}" value="${d}" ${v.damage===d?'checked':''} onchange="saveV(${c.id},${vid},'damage',this.value)"> ${d}</label>`).join('')}</div>
        </td></tr>
        <tr><td class="vlbl">カット</td><td>
          <div class="r-group"><label><input type="radio" name="cut-${vid}" value="有" ${v.cut==='有'?'checked':''} onchange="saveV(${c.id},${vid},'cut',this.value)"> 有</label><label><input type="radio" name="cut-${vid}" value="無" ${v.cut==='無'?'checked':''} onchange="saveV(${c.id},${vid},'cut',this.value)"> 無</label></div>
        </td></tr>
        <tr><td class="vlbl">担　当</td><td><input value="${v.charge||''}" onchange="saveV(${c.id},${vid},'charge',this.value)"></td></tr>
        <tr><td class="vlbl">薬　品</td><td><input value="${v.drug||''}" onchange="saveV(${c.id},${vid},'drug',this.value)" placeholder="例: 6Nア"></td></tr>
        <tr><td class="vlbl">ヘアダイ</td><td><input value="${v.dyeTime||''}" onchange="saveV(${c.id},${vid},'dyeTime',this.value)" placeholder="分"> 分</td></tr>
        <tr><td class="vlbl">トリート</td><td><input value="${v.trTime||''}" onchange="saveV(${c.id},${vid},'trTime',this.value)" placeholder="分"> 分</td></tr>
      </table>
      <textarea class="memo-area" style="margin-top:4px;min-height:${size==='lg'?44:34}px;font-size:10px" placeholder="メモ・申し送り" onchange="saveV(${c.id},${vid},'note',this.value)">${v.note||''}</textarea>
    </div>
    <div class="heads-col">
      <div>

// ===== CANVAS =====
function initCv(cid){
  const info=canvasRegistry[cid];if(!info)return;
  const cv=document.getElementById(cid);if(!cv)return;
  const ctx=cv.getContext('2d');
  ctx.lineCap='round';ctx.lineJoin='round';
  if(info.ink){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0,cv.width,cv.height);i.src=info.ink;}
  if(!info.history)info.history=[];
  let drawing=false,lx=0,ly=0;
  function gp(e){
    const r=cv.getBoundingClientRect(),scx=cv.width/r.width,scy=cv.height/r.height;
    const s=e.touches?e.touches[0]:e;
    return[(s.clientX-r.left)*scx,(s.clientY-r.top)*scy];
  }
  function sd(e){
    e.preventDefault();drawing=true;
    setActiveCv(cid);
    info.history=info.history.slice(-19);
    info.history.push(cv.toDataURL());
    [lx,ly]=gp(e);
  }
  function dr(e){
    if(!drawing)return;e.preventDefault();
    const[x,y]=gp(e);
    ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
    ctx.strokeStyle=erasing?'rgba(0,0,0,1)':pColor;
    ctx.lineWidth=erasing?pSz*5:pSz;
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
    [lx,ly]=[x,y];
  }
  function ed(){
    if(!drawing)return;drawing=false;
    const c=gc(curId);if(!c)return;
    const v=c.visits.find(v=>v.id===info.vid);
    if(v){v[info.part]=cv.toDataURL();scheduleSave();}
  }
  cv.addEventListener('mousedown',sd);cv.addEventListener('mousemove',dr);
  cv.addEventListener('mouseup',ed);cv.addEventListener('mouseleave',ed);
  cv.addEventListener('touchstart',sd,{passive:false});
  cv.addEventListener('touchmove',dr,{passive:false});
  cv.addEventListener('touchend',ed);
}

function setActiveCv(cid){
  activeCvInfo={cid,...canvasRegistry[cid],el:document.getElementById(cid),ctx:document.getElementById(cid)?.getContext('2d')};
  document.querySelectorAll('.head-wrap').forEach(w=>w.style.outline='none');
  const hw=document.getElementById('hw-'+cid);
  if(hw)hw.style.outline='2px solid #1a6fa8';
  document.getElementById('active-label').textContent='✏ 描き込み中';
}

function doUndo(){
  if(!activeCvInfo)return;
  const{el,ctx,cid}=activeCvInfo;
  const info=canvasRegistry[cid];
  if(!info||!info.history||!info.history.length)return;
  const prev=info.history.pop();
  const i=new Image();i.onload=()=>{ctx.clearRect(0,0,el.width,el.height);ctx.drawImage(i,0,0);};i.src=prev;
  info.ink=prev;
  const c=gc(curId);if(!c)return;
  const v=c.visits.find(v=>v.id===info.vid);if(v)v[info.part]=prev;
  scheduleSave();
}
function doClear(){
  if(!activeCvInfo)return;
  if(!confirm('この頭の絵の書き込みを消しますか？'))return;
  const{el,ctx,cid}=activeCvInfo;
  const info=canvasRegistry[cid];
  if(!info)return;
  info.history=info.history||[];
  info.history.push(el.toDataURL());
  ctx.clearRect(0,0,el.width,el.height);
  info.ink='';
  const c=gc(curId);if(!c)return;
  const v=c.visits.find(v=>v.id===info.vid);if(v)v[info.part]='';
  scheduleSave();
}

const GAS_CODE=`const FILE_NAME = 'SalonKarte_Data.json';
function doPost(e) {
  const data = JSON.parse(e.postData.contents);
  if (data.action === 'save') return reply(saveData(data.data));
  if (data.action === 'load') return reply(loadData());
  return reply({ok:false});
}
function doGet() { return reply({ok:true}); }
function reply(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
function saveData(db) {
  try {
    const files = DriveApp.getRootFolder().getFilesByName(FILE_NAME);
    const json = JSON.stringify(db);
    if (files.hasNext()) { files.next().setContent(json); }
    else { DriveApp.getRootFolder().createFile(FILE_NAME, json, MimeType.PLAIN_TEXT); }
    return {ok:true};
  } catch(e) { return {ok:false,error:e.toString()}; }
}
function loadData() {
  try {
    const files = DriveApp.getRootFolder().getFilesByName(FILE_NAME);
    if (files.hasNext()) { return {ok:true,data:JSON.parse(files.next().getBlob().getDataAsString())}; }
    return {ok:true,data:null};
  } catch(e) { return {ok:false,error:e.toString()}; }
}`;
