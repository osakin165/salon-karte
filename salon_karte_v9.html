<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Salon de SOAN — 電子カルテ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#00897b;--green-d:#00695c;--green-l:#e0f2f1;--border:#e0e0e0;--text:#212121;--sub:#757575}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:#eceff1;color:var(--text);font-size:13px;-webkit-tap-highlight-color:transparent}

/* TOP BAR */
.topbar{background:var(--green);color:#fff;height:50px;display:flex;align-items:center;padding:0 14px;gap:10px;position:fixed;top:0;left:0;right:0;z-index:200;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:.04em}
.ns{flex:1}
.tb{padding:7px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:600}
.tb:active{background:rgba(255,255,255,.2)}
.tb.solid{background:#fff;color:var(--green);border-color:#fff}
.tb.sync{background:rgba(255,255,255,.15)}

/* CUSTOMER BAR */
.custbar{background:#fff;border-bottom:1px solid var(--border);height:44px;display:flex;align-items:center;padding:0 12px;gap:8px;position:fixed;top:50px;left:0;right:0;z-index:190;overflow-x:auto}
.custbar::-webkit-scrollbar{display:none}
.csq{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-family:inherit;outline:none;background:#fff;flex-shrink:0;width:150px}
.csq:focus{border-color:var(--green)}
.cpill{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.cpill.on{background:var(--green);color:#fff;border-color:var(--green)}
.cpill.alg{border-color:#e53935;color:#e53935}
.cpill.on.alg{background:#e53935;color:#fff}

/* MAIN */
.main{margin-top:94px;padding:10px;display:flex;flex-direction:column;gap:10px}

/* CARD */
.kcard{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
.khdr{background:var(--green);color:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.khdr-title{font-size:12px;font-weight:700;letter-spacing:.04em}
.khdr-btns{display:flex;align-items:center;gap:8px}
.vhbtn{padding:4px 10px;border-radius:14px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600}
.vhbtn.danger{border-color:#ff8a80;color:#ff8a80}
.date-inp{border:none;border-bottom:2px solid rgba(255,255,255,.4);outline:none;font-size:13px;font-weight:700;font-family:inherit;background:transparent;color:#fff;width:105px;text-align:right}

/* 顧客情報カード */
.cust-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px}
.cust-section-title{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.1em;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--green-l)}
.irow{display:flex;align-items:center;padding:4px 0;border-bottom:1px solid #f5f5f5;min-height:28px}
.ilbl{font-size:10px;color:var(--sub);width:70px;flex-shrink:0;font-weight:600}
.ival{flex:1}
.ival input{width:100%;border:none;outline:none;font-size:13px;font-family:inherit;background:transparent;color:var(--text)}
.rg{display:flex;gap:6px;flex-wrap:wrap}
.rg label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:11px}
.rg input{accent-color:var(--green);width:12px;height:12px}

/* ===== 来店記録レイアウト =====
   左: 施術記録（固定幅）
   右: 写真3枚 + 手書きメモが一体化したエリア
*/
.vbody{display:grid;grid-template-columns:260px 1fr}
@media(max-width:700px){.vbody{grid-template-columns:1fr}}

/* 左カラム */
.col-left{border-right:1px solid var(--border);overflow-y:auto;max-height:700px;padding:10px 12px}
.col-left::-webkit-scrollbar{width:3px}
.col-left::-webkit-scrollbar-thumb{background:#ddd}
.schptb{display:flex;border:1px solid #ddd;border-radius:5px;overflow:hidden;margin-bottom:8px}
.scell{flex:1;text-align:center;border-right:1px solid #ddd;padding:3px 0}
.scell:last-child{border-right:none}
.scell label{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:11px;font-weight:700}
.scell input{accent-color:var(--green);width:13px;height:13px}
.vtbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px}
.vtbl td{border:1px solid #efefef;padding:4px 5px;vertical-align:middle}
.vtbl .vl{background:#f5f5f5;font-weight:700;color:#546e7a;white-space:nowrap;width:58px;font-size:10px}
.vtbl input{width:100%;border:none;outline:none;font-size:11px;font-family:inherit;background:transparent}
.vrg{display:flex;gap:3px;flex-wrap:wrap}
.vrg label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:10px}
.vrg input{accent-color:var(--green);width:11px;height:11px}
.sell-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.sell-cell{background:#f9f9f9;border-radius:4px;padding:5px 6px;border:1px solid #efefef}
.sell-lbl{font-size:9px;color:#999;font-weight:700;margin-bottom:2px}
.sell-cell input{width:100%;border:none;outline:none;font-size:11px;font-family:inherit;background:transparent}
.note-area{width:100%;border:1px solid #e8e8e8;border-radius:4px;font-size:11px;font-family:inherit;padding:5px;outline:none;resize:vertical;min-height:48px;margin-top:6px}

/* 右カラム: 写真3枚 + 手書きメモ */
.col-right{display:flex;flex-direction:column;background:#fafafa}

/* 写真3枚エリア */
.photos-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px;background:#f0f0f0}
.photo-slot{position:relative;background:#e0e0e0;border-radius:8px;overflow:hidden;aspect-ratio:3/4;cursor:pointer}
.photo-slot img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.photo-slot canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;z-index:3}
.photo-slot .ph-label{position:absolute;top:5px;left:5px;background:var(--green);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;z-index:5;pointer-events:none}
.photo-slot .ph-add{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#bbb;font-size:10px;gap:4px;z-index:2;pointer-events:none}
.photo-slot .ph-del{position:absolute;top:4px;right:4px;background:rgba(229,57,53,.85);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:13px;cursor:pointer;z-index:6;display:none;align-items:center;justify-content:center;line-height:1;padding:0}
.photo-slot:hover .ph-del{display:flex}
.photo-slot.sel{outline:3px solid var(--green);outline-offset:-3px}

/* 手書きメモ（写真の下、右カラム内） */
.memo-wrap{flex:1;position:relative;min-height:260px;background:#fffef5;border-top:1px solid #e8e8e8}
.memo-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:2}
.memo-ruled{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent,transparent 27px,#e8f5e9 27px,#e8f5e9 28px);pointer-events:none;z-index:1}
.memo-label{position:absolute;top:6px;right:8px;font-size:9px;color:#bbb;font-weight:700;z-index:3;pointer-events:none}

/* ペンツールバー */
.pen-bar{background:#fff;border-top:1px solid var(--border);padding:7px 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cdot{width:21px;height:21px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;flex-shrink:0}
.cdot.on{border-color:#333;transform:scale(1.1)}
.ptbtn{padding:4px 9px;border-radius:12px;border:1px solid #ddd;background:#fff;color:#555;font-size:10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.ptbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
.sz-sl{width:65px;cursor:pointer;accent-color:var(--green);flex-shrink:0}
.upload-lbl{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:12px;border:1px solid var(--green);background:#fff;color:var(--green);font-size:10px;cursor:pointer;font-weight:700}
.upload-lbl:hover{background:var(--green-l)}
.file-inp{display:none}
.pen-sep{width:1px;height:18px;background:#e0e0e0;flex-shrink:0}

/* ツールバー内のモード表示 */
.mode-badge{font-size:9px;background:var(--green-l);color:var(--green);padding:3px 7px;border-radius:10px;font-weight:700;flex-shrink:0}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:8px 18px;border-radius:20px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* EMPTY */
.empty{padding:60px 20px;text-align:center;color:#bbb;font-size:14px;line-height:2.4}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.md{background:#fff;border-radius:14px;width:100%;max-width:420px;padding:20px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.mdh{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--green)}
.fl{font-size:11px;color:var(--sub);margin-bottom:3px;margin-top:10px;display:block;font-weight:600}
.fi{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.fi:focus{border-color:var(--green)}
.mrg{display:flex;gap:14px;margin-top:6px}
.mrg label{display:flex;align-items:center;gap:5px;font-size:14px;cursor:pointer}
.mrg input{accent-color:var(--green)}
.ma{display:flex;gap:8px;margin-top:16px}
.bc{flex:1;padding:11px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:14px;cursor:pointer}
.bs{flex:2;padding:11px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:14px;font-weight:700;cursor:pointer}

/* SETUP */
.sbox{background:#fff;border-radius:12px;padding:18px;max-width:500px;margin:8px auto;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.sbox h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--green)}
.hint{background:#e0f2f1;border-left:4px solid var(--green);border-radius:4px;padding:9px 12px;font-size:11px;color:#555;line-height:1.7;margin-bottom:10px}
.step{display:flex;gap:7px;margin-bottom:7px;font-size:11px;color:#444;line-height:1.6}
.snum{background:var(--green);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">✦ Salon de SOAN｜電子カルテ</div>
  <div class="ns"></div>
  <button class="tb sync" id="btn-sync" onclick="syncNow()" style="display:none">☁ 同期</button>
  <button class="tb" id="btn-nc" onclick="openNewCust()" style="display:none">＋新規顧客</button>
  <button class="tb solid" id="btn-setup" onclick="showSetup()">⚙ 設定</button>
</div>

<div class="custbar" id="custbar" style="display:none">
  <input class="csq" type="text" id="sq" placeholder="🔍 名前・電話で検索" oninput="doSearch()">
  <div id="pills" style="display:flex;gap:6px;flex-shrink:0"></div>
</div>

<div class="main" id="main">
  <div id="sarea"></div>
  <div class="empty" id="empty" style="display:none">
    ✦<br>顧客を選択するか、新規顧客を登録してください<br>
    <button onclick="openNewCust()" style="margin-top:14px;padding:11px 24px;border-radius:24px;background:var(--green);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer">＋ 新規顧客登録</button>
  </div>
  <div id="karea"></div>
</div>

<div class="toast" id="toast"></div>
<div id="mroot"></div>

<script>
var GAS_KEY='soan_v9';
var GAS_URL=localStorage.getItem(GAS_KEY)||'';
var db={customers:[],nid:1};
var curId=null, syncTimer=null;
var pColor='#111', pSz=2, erasing=false;
var activeDraw=null; // {el,ctx,v,ik,hk}
var activeMode='photo'; // 'photo' or 'memo'

function toast(msg,dur){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},dur||2200);
}

async function gasReq(action,data){
  if(!GAS_URL)return null;
  try{var res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:action,data:data})});return await res.json();}
  catch(e){return null;}
}
async function loadCloud(){
  toast('☁ 読み込み中...',4000);
  var res=await gasReq('load');
  if(res&&res.ok&&res.data){db=res.data;toast('✅ 読み込みました');}
  else{loadLocal();toast('⚠ ローカルデータを使用');}
  renderPills();
}
async function saveCloud(){
  saveLocal();
  if(!GAS_URL)return;
  var res=await gasReq('save',db);
  if(res&&res.ok)toast('✅ 保存しました');
  else toast('⚠ クラウド保存失敗（ローカルに保存済み）');
}
function scheduleSave(){clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,2000);}
function syncNow(){saveCloud();}
function saveLocal(){
  try{
    var s=JSON.parse(JSON.stringify(db));
    if(s.customers)s.customers.forEach(function(c){
      if(c.visits)c.visits.forEach(function(v){
        v.photoInks=['','',''];v.photoHists=[[],[],[]];v.memoInk='';v.memoHist=[];
      });
    });
    localStorage.setItem('soan_v9',JSON.stringify(s));
  }catch(e){}
}
function loadLocal(){
  try{var s=localStorage.getItem('soan_v9');if(s)db=JSON.parse(s);}catch(e){}
}

function gc(id){return db.customers.find(function(c){return c.id===id;});}
function ensureV(c,vi){
  if(!c.visits)c.visits=[];
  while(c.visits.length<=vi)c.visits.push({
    menu:{},len:'S',damage:'無',cut:'有',charge:'',drug:'',dyeTime:'',trTime:'',retail:'',price:'',note:'',date:'',
    photos:[null,null,null],photoInks:['','',''],photoHists:[[],[],[]],memoInk:'',memoHist:[]
  });
  var v=c.visits[vi];
  if(!v.photos)v.photos=[null,null,null];
  if(!v.photoInks)v.photoInks=['','',''];
  if(!v.photoHists)v.photoHists=[[],[],[]];
  if(!v.memoInk)v.memoInk='';
  if(!v.memoHist)v.memoHist=[];
}

function doSearch(){renderPills(document.getElementById('sq').value.trim().toLowerCase());}
function renderPills(q){
  q=q||'';
  var list=db.customers;
  if(q)list=list.filter(function(c){return c.name.toLowerCase().indexOf(q)>=0||(c.tel||'').replace(/-/g,'').indexOf(q.replace(/-/g,''))>=0;});
  var el=document.getElementById('pills');el.innerHTML='';
  list.forEach(function(c){
    var sp=document.createElement('span');
    sp.className='cpill'+(c.id===curId?' on':'')+(c.allergy&&c.allergy!=='無'?' alg':'');
    sp.textContent=c.name;sp.onclick=function(){selCust(c.id);};
    el.appendChild(sp);
  });
}
function selCust(id){curId=id;activeDraw=null;renderPills(document.getElementById('sq').value.trim().toLowerCase());renderKarte();}

// ===== DRAW =====
function initCanvas(cvEl,v,ik,hk){
  function resize(){
    var w=cvEl.parentElement.offsetWidth,h=cvEl.parentElement.offsetHeight;
    if(!w||!h)return;
    var prev=Array.isArray(v[ik])?v[ik][hk]:v[ik]||'';
    cvEl.width=w;cvEl.height=h;
    var ctx=cvEl.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
    if(prev){var pi=new Image();pi.onload=function(){ctx.drawImage(pi,0,0,w,h);};pi.src=prev;}
  }
  setTimeout(resize,80);
  window.addEventListener('resize',resize);
  var drawing=false,lx=0,ly=0;
  function gp(e){var r=cvEl.getBoundingClientRect(),scx=cvEl.width/r.width,scy=cvEl.height/r.height;var s=e.touches?e.touches[0]:e;return[(s.clientX-r.left)*scx,(s.clientY-r.top)*scy];}
  function sd(e){
    e.preventDefault();drawing=true;
    var ctx=cvEl.getContext('2d');
    activeDraw={el:cvEl,ctx:ctx,v:v,ik:ik,hk:hk};
    var hist=Array.isArray(v[ik])?v[ik][hk]:v[hk];
    if(!hist)hist=[];
    hist=hist.slice(-19);hist.push(cvEl.toDataURL());
    if(Array.isArray(v[ik]))v[ik][hk]=hist; else v[hk]=hist;
    var p=gp(e);lx=p[0];ly=p[1];
  }
  function dr(e){
    if(!drawing)return;e.preventDefault();
    var ctx=cvEl.getContext('2d'),p=gp(e),x=p[0],y=p[1];
    ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
    ctx.strokeStyle=erasing?'rgba(0,0,0,1)':pColor;
    ctx.lineWidth=erasing?pSz*5:pSz;
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
    lx=x;ly=y;
  }
  function ed(){
    if(!drawing)return;drawing=false;
    if(Array.isArray(v[ik]))v[ik][hk]=cvEl.toDataURL();
    else v[ik]=cvEl.toDataURL();
    scheduleSave();
  }
  cvEl.addEventListener('mousedown',sd);cvEl.addEventListener('mousemove',dr);
  cvEl.addEventListener('mouseup',ed);cvEl.addEventListener('mouseleave',ed);
  cvEl.addEventListener('touchstart',sd,{passive:false});
  cvEl.addEventListener('touchmove',dr,{passive:false});
  cvEl.addEventListener('touchend',ed);
}

function setColor(dot){
  erasing=false;
  document.querySelectorAll('.cdot').forEach(function(d){d.classList.remove('on');});
  dot.classList.add('on');pColor=dot.dataset.c;
  document.querySelectorAll('.eraser-btn').forEach(function(b){b.classList.remove('on');});
}
function toggleEr(btn){erasing=!erasing;btn.classList.toggle('on',erasing);}
function doUndo(){
  if(!activeDraw)return;
  var d=activeDraw;
  var hist=Array.isArray(d.v[d.ik])?d.v[d.ik][d.hk]:d.v[d.hk];
  if(!hist||!hist.length)return;
  var prev=hist.pop();
  if(Array.isArray(d.v[d.ik]))d.v[d.ik][d.hk]=hist; else d.v[d.hk]=hist;
  var img=new Image();img.onload=function(){d.ctx.clearRect(0,0,d.el.width,d.el.height);d.ctx.drawImage(img,0,0);};img.src=prev;
  if(Array.isArray(d.v[d.ik]))d.v[d.ik][d.hk]=prev; else d.v[d.ik]=prev;
  scheduleSave();
}
function doClear(msg){
  if(!activeDraw){toast('先にキャンバスをタップ');return;}
  if(!confirm(msg||'書き込みを消しますか？'))return;
  var d=activeDraw;
  var hist=Array.isArray(d.v[d.ik])?d.v[d.ik][d.hk]:d.v[d.hk];
  if(!hist)hist=[];hist.push(d.el.toDataURL());
  if(Array.isArray(d.v[d.ik])){d.v[d.ik][d.hk]=hist;d.v[d.ik][d.hk]='';} else {d.v[d.hk]=hist;d.v[d.ik]='';}
  d.ctx.clearRect(0,0,d.el.width,d.el.height);scheduleSave();
}

function today(){var d=new Date();return d.getFullYear()+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0');}

// ===== RENDER =====
function renderKarte(){
  var c=gc(curId);if(!c)return;
  document.getElementById('empty').style.display='none';
  var ka=document.getElementById('karea');ka.innerHTML='';activeDraw=null;
  ka.appendChild(makeCustCard(c));
  if(!c.visits||!c.visits.length)ensureV(c,0);
  c.visits.forEach(function(v,i){ka.appendChild(makeVisitCard(c,i));});
  var addDiv=document.createElement('div');addDiv.style.cssText='text-align:center;padding:14px';
  var addBtn=document.createElement('button');
  addBtn.style.cssText='padding:11px 26px;border-radius:24px;border:2px dashed var(--green);background:#fff;color:var(--green);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit';
  addBtn.textContent='＋ 来店記録を追加';
  addBtn.onclick=function(){ensureV(c,c.visits.length);scheduleSave();renderKarte();setTimeout(function(){var cards=document.querySelectorAll('.kcard');if(cards.length)cards[cards.length-1].scrollIntoView({behavior:'smooth'});},200);toast('来店記録を追加しました');};
  addDiv.appendChild(addBtn);ka.appendChild(addDiv);
}

// 顧客情報カード
function makeCustCard(c){
  var card=document.createElement('div');card.className='kcard';
  var hdr=document.createElement('div');hdr.className='khdr';
  hdr.innerHTML='<div class="khdr-title">📋 顧客基本情報 — '+c.name+'</div>';

        e.stopPropagation();
        if(!confirm('写真を削除しますか？'))return;
        v.photos[idx]=null;v.photoInks[idx]='';v.photoHists[idx]=[];
        var pi2=slot.querySelector('img[style*="z-index:4"]');if(pi2)slot.removeChild(pi2);
        var cv2=slot.querySelector('canvas');if(cv2)cv2.getContext('2d').clearRect(0,0,cv2.width,cv2.height);
        scheduleSave();
      };
      slot.appendChild(db2);

      // キャンバス
      var cv=document.createElement('canvas');slot.appendChild(cv);

      // スロット選択
      slot.onclick=function(e){
        if(e.target===db2)return;
        activeSlot=idx;
        slots.forEach(function(s){s.classList.remove('sel');});
        slot.classList.add('sel');
        updateModeBadge('photo'+(idx+1));
      };

      // Canvas初期化
      setTimeout(function(){
        function rsz(){
          var w=slot.offsetWidth,h=slot.offsetHeight;if(!w||!h)return;
          cv.width=w;cv.height=h;
          var ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
          if(v.photoInks[idx]){var pi3=new Image();pi3.onload=function(){ctx.drawImage(pi3,0,0,w,h);};pi3.src=v.photoInks[idx];}
        }
        rsz();window.addEventListener('resize',rsz);
        var dwg=false,lx3=0,ly3=0;
        function gp3(e){var r=cv.getBoundingClientRect(),scx=cv.width/r.width,scy=cv.height/r.height;var s=e.touches?e.touches[0]:e;return[(s.clientX-r.left)*scx,(s.clientY-r.top)*scy];}
        function sd3(e){
          e.preventDefault();dwg=true;activeSlot=idx;
          slots.forEach(function(s){s.classList.remove('sel');});slot.classList.add('sel');
          var ctx=cv.getContext('2d');
          activeDraw={el:cv,ctx:ctx,v:v,ik:'photoInks',hk:idx};
          if(!v.photoHists[idx])v.photoHists[idx]=[];
          v.photoHists[idx]=v.photoHists[idx].slice(-19);v.photoHists[idx].push(cv.toDataURL());
          var p=gp3(e);lx3=p[0];ly3=p[1];
        }
        function dr3(e){
          if(!dwg)return;e.preventDefault();
          var ctx=cv.getContext('2d'),p=gp3(e),x=p[0],y=p[1];
          ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
          ctx.strokeStyle=erasing?'rgba(0,0,0,1)':pColor;
          ctx.lineWidth=erasing?pSz*5:pSz;
          ctx.beginPath();ctx.moveTo(lx3,ly3);ctx.lineTo(x,y);ctx.stroke();lx3=x;ly3=y;
        }
        function ed3(){if(!dwg)return;dwg=false;v.photoInks[idx]=cv.toDataURL();scheduleSave();}
        cv.addEventListener('mousedown',sd3);cv.addEventListener('mousemove',dr3);cv.addEventListener('mouseup',ed3);cv.addEventListener('mouseleave',ed3);
        cv.addEventListener('touchstart',sd3,{passive:false});cv.addEventListener('touchmove',dr3,{passive:false});cv.addEventListener('touchend',ed3);
      },100);

      slots.push(slot);
      pRow.appendChild(slot);
    })(si);
  }
  right.appendChild(pRow);

  // 写真アップロードボタン
  var upWrap=document.createElement('div');upWrap.style.cssText='padding:5px 8px;background:#f5f5f5;border-top:1px solid #eee;display:flex;align-items:center;gap:6px';
  var upLbl=document.createElement('label');upLbl.className='upload-lbl';
  upLbl.innerHTML='📷 写真を追加（選択中スロット）';
  var fInp=document.createElement('input');fInp.type='file';fInp.accept='image/*';fInp.className='file-inp';
  fInp.onchange=function(){
    var file=this.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
      v.photos[activeSlot]=e.target.result;
      var slot=slots[activeSlot];
      var existing=slot.querySelector('img[style*="z-index:4"]');if(existing)slot.removeChild(existing);
      var ni=document.createElement('img');ni.src=e.target.result;
      ni.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:4;';
      slot.appendChild(ni);
      scheduleSave();toast('写真を追加しました');
    };
    reader.readAsDataURL(file);
  };
  upLbl.appendChild(fInp);upWrap.appendChild(upLbl);
  var modeSpan=document.createElement('span');modeSpan.className='mode-badge';modeSpan.id='mode-'+vi+'-'+c.id;modeSpan.textContent='写真1選択中';
  upWrap.appendChild(modeSpan);
  right.appendChild(upWrap);

  function updateModeBadge(mode){
    var el=document.getElementById('mode-'+vi+'-'+c.id);
    if(el)el.textContent=mode==='memo'?'手書きメモ選択中':'写真'+(activeSlot+1)+'選択中';
  }

  // 手書きメモエリア
  var mWrap=document.createElement('div');mWrap.className='memo-wrap';
  var ruled=document.createElement('div');ruled.className='memo-ruled';mWrap.appendChild(ruled);
  var mLabel=document.createElement('div');mLabel.className='memo-label';mLabel.textContent='手書きメモ ✏';mWrap.appendChild(mLabel);
  var mCv=document.createElement('canvas');mWrap.appendChild(mCv);
  right.appendChild(mWrap);

  // メモキャンバス初期化
  setTimeout(function(){
    function mrsz(){
      var w=mWrap.offsetWidth,h=mWrap.offsetHeight;if(!w||!h)return;
      mCv.width=w;mCv.height=h;
      var ctx=mCv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
      if(v.memoInk){var pi=new Image();pi.onload=function(){ctx.drawImage(pi,0,0,w,h);};pi.src=v.memoInk;}
    }
    mrsz();window.addEventListener('resize',mrsz);
    var mdwg=false,mlx=0,mly=0;
    function mgp(e){var r=mCv.getBoundingClientRect(),scx=mCv.width/r.width,scy=mCv.height/r.height;var s=e.touches?e.touches[0]:e;return[(s.clientX-r.left)*scx,(s.clientY-r.top)*scy];}
    function msd(e){
      e.preventDefault();mdwg=true;
      var ctx=mCv.getContext('2d');
      activeDraw={el:mCv,ctx:ctx,v:v,ik:'memoInk',hk:'memoHist'};
      updateModeBadge('memo');
      if(!v.memoHist)v.memoHist=[];
      v.memoHist=v.memoHist.slice(-19);v.memoHist.push(mCv.toDataURL());
      var p=mgp(e);mlx=p[0];mly=p[1];
    }
    function mdr(e){
      if(!mdwg)return;e.preventDefault();
      var ctx=mCv.getContext('2d'),p=mgp(e),x=p[0],y=p[1];
      ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
      ctx.strokeStyle=erasing?'rgba(0,0,0,1)':pColor;
      ctx.lineWidth=erasing?pSz*5:pSz;
      ctx.beginPath();ctx.moveTo(mlx,mly);ctx.lineTo(x,y);ctx.stroke();mlx=x;mly=y;
    }
    function med(){if(!mdwg)return;mdwg=false;v.memoInk=mCv.toDataURL();scheduleSave();}
    mCv.addEventListener('mousedown',msd);mCv.addEventListener('mousemove',mdr);mCv.addEventListener('mouseup',med);mCv.addEventListener('mouseleave',med);
    mCv.addEventListener('touchstart',msd,{passive:false});mCv.addEventListener('touchmove',mdr,{passive:false});mCv.addEventListener('touchend',med);
  },120);

  // 共通ペンバー
  var pBar=document.createElement('div');pBar.className='pen-bar';
  ['#111','#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#fff'].forEach(function(col,i){
    var dot=document.createElement('div');dot.className='cdot'+(i===0?' on':'');
    dot.style.background=col;if(col==='#fff')dot.style.border='2px solid #ddd';
    dot.dataset.c=col;dot.onclick=function(){setColor(this);};pBar.appendChild(dot);
  });
  var sep=document.createElement('div');sep.className='pen-sep';pBar.appendChild(sep);
  var erBtn=document.createElement('button');erBtn.className='ptbtn eraser-btn';erBtn.textContent='消しゴム';
  erBtn.onclick=function(){toggleEr(this);};pBar.appendChild(erBtn);
  var szL=document.createElement('span');szL.style.cssText='font-size:10px;color:#999;flex-shrink:0';szL.textContent='太さ';pBar.appendChild(szL);
  var szS=document.createElement('input');szS.type='range';szS.min=1;szS.max=20;szS.value=2;szS.className='sz-sl';
  szS.oninput=function(){pSz=+this.value;};pBar.appendChild(szS);
  var sep2=document.createElement('div');sep2.className='pen-sep';pBar.appendChild(sep2);
  var undoBtn=document.createElement('button');undoBtn.className='ptbtn';undoBtn.textContent='↩ 戻す';undoBtn.onclick=doUndo;pBar.appendChild(undoBtn);
  var clrBtn=document.createElement('button');clrBtn.className='ptbtn';clrBtn.textContent='🗑 クリア';clrBtn.onclick=function(){doClear('書き込みを消しますか？');};pBar.appendChild(clrBtn);
  right.appendChild(pBar);

  body.appendChild(left);body.appendChild(right);card.appendChild(body);
  return card;
}

  aFi('nc-n','お名前 *','text','山田 花子');aFi('nc-k','フリガナ','text','ヤマダ ハナコ');

var GAS_CODE='const FILE_NAME="SalonKarte_Data.json";function doPost(e){const d=JSON.parse(e.postData.contents);if(d.action==="save")return r(save(d.data));if(d.action==="load")return r(load());return r({ok:false})}function doGet(){return r({ok:true})}function r(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}function save(db){try{const f=DriveApp.getRootFolder().getFilesByName(FILE_NAME);const j=JSON.stringify(db);if(f.hasNext()){f.next().setContent(j);}else{DriveApp.getRootFolder().createFile(FILE_NAME,j,MimeType.PLAIN_TEXT);}return{ok:true};}catch(e){return{ok:false,error:e.toString()};}}function load(){try{const f=DriveApp.getRootFolder().getFilesByName(FILE_NAME);if(f.hasNext()){return{ok:true,data:JSON.parse(f.next().getBlob().getDataAsString())};}return{ok:true,data:null};}catch(e){return{ok:false,error:e.toString()};}}';

  var cpBtn=document.createElement('button');cpBtn.style.cssText='margin-bottom:8px;padding:8px 14px;font-size:12px;border-radius:20px;cursor:pointer;background:var(--green);color:#fff;border:none;font-weight:700';cpBtn.textContent='📋 GASコードをコピー';
  cpBtn.onclick=function(){try{navigator.clipboard.writeText(GAS_CODE).then(function(){toast('✅ コピーしました');});}catch(e){var t=document.createElement('textarea');t.value=GAS_CODE;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('✅ コピーしました');}};
  box.appendChild(cpBtn);

  var inp=document.createElement('input');inp.className='fi';inp.id='gas-in';inp.value=GAS_URL;inp.placeholder='https://script.google.com/macros/s/...';inp.style.marginBottom='8px';box.appendChild(inp);

  var conn=document.createElement('button');conn.style.cssText='flex:2;padding:10px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer';conn.textContent='接続する';
  conn.onclick=async function(){var url=(document.getElementById('gas-in').value||'').trim();if(!url){alert('URLを入力してください');return;}GAS_URL=url;localStorage.setItem(GAS_KEY,url);sa.innerHTML='';showApp();await loadCloud();};
  btns.appendChild(conn);
  if(GAS_URL){var cb=document.createElement('button');cb.style.cssText='flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;cursor:pointer;background:#fff';cb.textContent='閉じる';cb.onclick=function(){sa.innerHTML='';};btns.appendChild(cb);}
  box.appendChild(btns);sa.appendChild(box);

  document.getElementById('btn-sync').style.display='inline-block';
