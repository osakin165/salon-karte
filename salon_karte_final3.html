<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Salon de SOAN — 電子カルテ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#d5d1ca;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:13px}
.nav{background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;height:52px;position:fixed;top:0;left:0;right:0;z-index:200}
.ntitle{font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:.04em}
.ns{flex:1}
.nb{padding:6px 12px;border-radius:6px;border:1px solid #555;background:transparent;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.nb:active{background:#333}
.pri{background:#fff!important;color:#1a1a1a!important;border-color:#fff!important;font-weight:700}
.sync{background:#1a6fa8!important;border-color:#1a6fa8!important}
.tbar{background:#222;display:flex;align-items:center;gap:6px;padding:0 12px;height:44px;position:fixed;top:52px;left:0;right:0;z-index:190;overflow-x:auto}
.tbar::-webkit-scrollbar{display:none}
.cdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0}
.cdot.on{border-color:#fff}
.tbtn{padding:4px 9px;border-radius:12px;border:1px solid #555;background:transparent;color:#aaa;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.tbtn.on{background:#fff;color:#111;border-color:#fff;font-weight:700}
.tsep{width:1px;height:20px;background:#444;flex-shrink:0}
.cbar{background:#eeebe6;border-bottom:1px solid #ccc;padding:0 12px;height:42px;display:flex;align-items:center;gap:8px;position:fixed;top:96px;left:0;right:0;z-index:180;overflow-x:auto}
.cbar::-webkit-scrollbar{display:none}
.sq{padding:5px 10px;border:1px solid #bbb;border-radius:14px;font-size:12px;font-family:inherit;outline:none;background:#fff;flex-shrink:0;width:140px}
.cpill{padding:4px 12px;border-radius:14px;border:1px solid #ccc;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cpill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.cpill.alg{border-color:#c0392b;color:#c0392b}
.cpill.on.alg{background:#c0392b;color:#fff}
.main{margin-top:138px;padding:10px;display:flex;flex-direction:column;gap:10px}
.kcard{background:#fff;border:1px solid #bbb;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.khdr{background:#333;color:#fff;padding:6px 12px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:space-between;letter-spacing:.03em}
.kbtn{padding:3px 8px;border-radius:8px;border:1px solid #666;background:transparent;color:#ccc;font-size:10px;cursor:pointer;font-family:inherit}
.krow{display:flex;border-bottom:1px solid #bbb}
.krow:last-child{border-bottom:none}
.kcol{flex:1;border-right:1px solid #bbb;padding:8px;min-width:0}
.kcol:last-child{border-right:none}
/* 基本情報 */
.sec-title{font-size:11px;font-weight:700;letter-spacing:.2em;text-align:center;padding:5px 0 6px;border-bottom:2px solid #333;margin-bottom:8px}
.irow{display:flex;align-items:center;border-bottom:1px solid #eee;padding:3px 0;min-height:22px}
.ilbl{font-size:10px;color:#666;min-width:64px;flex-shrink:0}
.ival{flex:1}
.ival input{width:100%;border:none;outline:none;font-size:12px;font-family:inherit;background:transparent;color:#1a1a1a;padding:1px 2px}
.stbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:10px}
.stbl td{border:1px solid #bbb;padding:2px 4px;vertical-align:middle}
.sth{background:#555;color:#fff;font-weight:700;text-align:center;white-space:nowrap}
.sth2{background:#333;color:#fff;font-weight:700;text-align:center;white-space:nowrap}
.rg{display:flex;gap:4px;flex-wrap:wrap}
.rg label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:10px;white-space:nowrap}
.rg input{accent-color:#1a1a1a;width:11px;height:11px}
.ckg{display:flex;gap:4px;flex-wrap:wrap}
.ckg label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:11px;font-weight:700}
.ckg input{accent-color:#1a1a1a;width:12px;height:12px}
/* 施術記録 */
.vhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid #eee}
.vdate{border:none;border-bottom:1px solid #ccc;outline:none;font-size:12px;font-weight:700;font-family:inherit;width:108px;background:transparent;text-align:right}
.schptb{display:flex;border:1px solid #bbb;border-radius:2px;overflow:hidden;margin-bottom:5px}
.scell{flex:1;text-align:center;border-right:1px solid #bbb;padding:2px 0}
.scell:last-child{border-right:none}
.scell label{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:11px;font-weight:700}
.scell input{accent-color:#1a1a1a;width:12px;height:12px}
.vtbl{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:4px}
.vtbl td{border:1px solid #ddd;padding:2px 4px;vertical-align:middle}
.vtbl .vl{background:#f0ede8;font-weight:700;white-space:nowrap;width:58px}
.vtbl input{width:100%;border:none;outline:none;font-size:10px;font-family:inherit;background:transparent}
.vrg{display:flex;gap:3px;flex-wrap:wrap}
.vrg label{display:flex;align-items:center;gap:2px;cursor:pointer;font-size:10px;white-space:nowrap}
.vrg input{accent-color:#1a1a1a;width:10px;height:10px}
.vmemo{width:100%;font-size:11px;font-family:inherit;border:1px solid #e0e0e0;border-radius:3px;padding:4px;resize:vertical;outline:none;min-height:44px}
/* 頭部イラスト */
.heads{display:flex;flex-direction:column;gap:6px;width:130px;flex-shrink:0;border-left:1px solid #e0e0e0;padding:6px;align-items:center}
.hwrap{position:relative;overflow:hidden;touch-action:none;background:#fff;cursor:crosshair;border:1px solid #e8e8e8;border-radius:3px;width:116px}
.hwrap img{display:block;width:100%;height:auto;pointer-events:none}
.hwrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
.hwrap.act{outline:2px solid #1a6fa8}
.hlbl{font-size:10px;color:#888;text-align:center;margin-top:2px}
/* 来店履歴 */
.htbl{width:100%;border-collapse:collapse;font-size:9px}
.htbl th{background:#555;color:#fff;padding:2px 2px;text-align:center;border:1px solid #999;font-size:9px}
.htbl td{border:1px solid #ddd;padding:1px 2px;height:19px}
.htbl td input{width:100%;border:none;outline:none;font-size:9px;font-family:inherit;background:transparent;text-align:center}
.hck{display:flex;justify-content:center;gap:1px}
.hck label{display:flex;align-items:center;font-size:8px;cursor:pointer}
.hck input{accent-color:#1a1a1a;width:9px;height:9px}
/* メモ */
.mline{border:none;border-bottom:1px solid #ddd;width:100%;font-size:12px;font-family:inherit;padding:4px 2px;outline:none;resize:none;min-height:30px;background:transparent;display:block}
/* トースト */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:6px 14px;border-radius:16px;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.empty{padding:50px 16px;text-align:center;color:#aaa;font-size:13px;line-height:2.2}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:400;padding:14px}
.md{background:#fff;border-radius:12px;width:100%;max-width:420px;padding:18px;max-height:90vh;overflow-y:auto}
.mdh{font-size:15px;font-weight:700;margin-bottom:12px}
.fl{font-size:11px;color:#888;margin-bottom:3px;margin-top:8px;display:block}
.fi{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;outline:none}
.fi:focus{border-color:#888}
.mrg{display:flex;gap:14px;margin-top:5px}
.mrg label{display:flex;align-items:center;gap:4px;font-size:14px;cursor:pointer}
.ma{display:flex;gap:8px;margin-top:12px}
.bc{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer}
.bs{flex:2;padding:10px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.sbox{background:#fff;border-radius:10px;padding:16px;max-width:480px;margin:6px auto;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sbox h3{font-size:14px;font-weight:700;margin-bottom:8px}
.hint{background:#fffbe6;border:1px solid #e8d050;border-radius:6px;padding:8px 12px;font-size:11px;color:#666;line-height:1.7;margin-bottom:8px}
.step{display:flex;gap:6px;margin-bottom:6px;font-size:11px;color:#444;line-height:1.6}
.snum{background:#1a1a1a;color:#fff;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:2px}
</style>
</head>
<body>
<div class="nav">
  <div class="ntitle">✦ Salon de SOAN｜電子カルテ</div>
  <div class="ns"></div>
  <button class="nb sync" id="btn-sync" onclick="syncNow()" style="display:none">☁ 同期</button>
  <button class="nb pri" id="btn-nc" onclick="openNewCust()" style="display:none">＋新規顧客</button>
  <button class="nb pri" id="btn-setup" onclick="showSetup()">⚙ 設定</button>
</div>
<div class="tbar" id="tbar" style="display:none">
  <span style="font-size:10px;color:#888;flex-shrink:0">ペン</span>
  <div class="cdot on" style="background:#111" data-c="#111" onclick="setC(this)"></div>
  <div class="cdot" style="background:#c0392b" data-c="#c0392b" onclick="setC(this)"></div>
  <div class="cdot" style="background:#1a6fa8" data-c="#1a6fa8" onclick="setC(this)"></div>
  <div class="cdot" style="background:#1e8449" data-c="#1e8449" onclick="setC(this)"></div>
  <div class="cdot" style="background:#d68910" data-c="#d68910" onclick="setC(this)"></div>
  <div class="tsep"></div>
  <button class="tbtn" id="btn-er" onclick="toggleEr()">消しゴム</button>
  <span style="font-size:10px;color:#888;flex-shrink:0">太さ</span>
  <input type="range" min="1" max="18" value="2" oninput="pSz=+this.value" style="width:65px;flex-shrink:0;accent-color:#fff">
  <div class="tsep"></div>
  <button class="tbtn" onclick="doUndo()">↩ 戻す</button>
  <button class="tbtn" onclick="doClear()">🗑 クリア</button>
  <div class="tsep"></div>
  <span id="dhint" style="font-size:10px;color:#5a8;flex-shrink:0">← 頭の絵をタップして描く</span>
</div>
<div class="cbar" id="cbar" style="display:none">
  <input class="sq" type="text" id="sq" placeholder="🔍 名前・電話" oninput="doSearch()">
  <div id="pills" style="display:flex;gap:5px;flex-shrink:0"></div>
</div>
<div class="main" id="main">
  <div id="sarea"></div>
  <div class="empty" id="empty" style="display:none">
    ✦<br>顧客を選択するか、新規顧客を登録してください<br>
    <button class="nb pri" onclick="openNewCust()" style="margin-top:12px;padding:9px 18px;font-size:13px">＋ 新規顧客登録</button>
  </div>
  <div id="karea"></div>
</div>
<div class="toast" id="toast"></div>
<div id="mroot"></div>

var GAS_KEY = 'soan_v8';
var GAS_URL = localStorage.getItem(GAS_KEY) || '';
var pColor = '#111', pSz = 2, erasing = false;
var curId = null, activeHead = null;
var db = {customers:[], nid:1};
var syncTimer = null;

function toast(msg, dur) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('show'); }, dur||2000);
}

async function gasReq(action, data) {
  if(!GAS_URL) return null;
  try {
    var res = await fetch(GAS_URL, {method:'POST', body:JSON.stringify({action:action, data:data})});
    return await res.json();
  } catch(e) { return null; }
}
async function loadCloud() {
  toast('☁ 読み込み中...', 4000);
  var res = await gasReq('load');
  if(res && res.ok && res.data) { db = res.data; toast('✅ 読み込みました'); }
  else { loadLocal(); toast('⚠ ローカルデータを使用'); }
  renderPills();
}
async function saveCloud() {
  saveLocal();
  if(!GAS_URL) return;
  var res = await gasReq('save', db);
  if(res && res.ok) toast('✅ 保存しました');
  else toast('⚠ クラウド保存失敗');
}
function scheduleSave() { clearTimeout(syncTimer); syncTimer = setTimeout(saveCloud, 2000); }
function syncNow() { saveCloud(); }
function saveLocal() {
  try {
    var s = JSON.parse(JSON.stringify(db));
    if(s.customers) s.customers.forEach(function(c) {
      if(c.visits) c.visits.forEach(function(v) { v.iF=''; v.iS=''; v.iB=''; v.hF=[]; v.hS=[]; v.hB=[]; });
    });
    localStorage.setItem('soan_v8', JSON.stringify(s));
  } catch(e) {}
}
function loadLocal() {
  try { var s=localStorage.getItem('soan_v8'); if(s) db=JSON.parse(s); } catch(e) {}
}

function gc(id) { return db.customers.find(function(c){ return c.id===id; }); }
function ensureV(c, vi) {
  if(!c.visits) c.visits=[];
  while(c.visits.length<=vi) c.visits.push({menu:{}, iF:'', iS:'', iB:'', hF:[], hS:[], hB:[]});
}

function doSearch() { renderPills(document.getElementById('sq').value.trim().toLowerCase()); }
function renderPills(q) {
  q = q||'';
  var list = db.customers;
  if(q) list = list.filter(function(c){
    return c.name.toLowerCase().indexOf(q)>=0 || (c.tel||'').replace(/-/g,'').indexOf(q.replace(/-/g,''))>=0;
  });
  var el = document.getElementById('pills');
  el.innerHTML = '';
  list.forEach(function(c) {
    var sp = document.createElement('span');
    sp.className = 'cpill' + (c.id===curId?' on':'') + (c.allergy&&c.allergy!=='無'?' alg':'');
    sp.textContent = c.name;
    sp.onclick = function(){ selCust(c.id); };
    el.appendChild(sp);
  });
}
function selCust(id) {
  curId=id; activeHead=null;
  renderPills(document.getElementById('sq').value.trim().toLowerCase());
  renderKarte();
}

function setC(dot) {
  erasing=false; document.getElementById('btn-er').classList.remove('on');
  pColor=dot.dataset.c;
  document.querySelectorAll('.cdot').forEach(function(d){ d.classList.remove('on'); });
  dot.classList.add('on');
}
function toggleEr() { erasing=!erasing; document.getElementById('btn-er').classList.toggle('on',erasing); }
function doUndo() {
  if(!activeHead) return;
  var h=activeHead, hist=h.v[h.hk]||[];
  if(!hist.length) return;
  var prev=hist.pop(); h.v[h.hk]=hist;
  var img=new Image(); img.onload=function(){ h.ctx.clearRect(0,0,h.el.width,h.el.height); h.ctx.drawImage(img,0,0); }; img.src=prev;
  h.v[h.ik]=prev; scheduleSave();
}
function doClear() {
  if(!activeHead) return;
  if(!confirm('この頭の絵の書き込みを消しますか？')) return;
  var h=activeHead;
  if(!h.v[h.hk]) h.v[h.hk]=[];
  h.v[h.hk].push(h.el.toDataURL());
  h.ctx.clearRect(0,0,h.el.width,h.el.height);
  h.v[h.ik]=''; scheduleSave();
}

function initHead(wrapEl, imgSrc, v, ik, hk) {
  var img = document.createElement('img');
  img.src = imgSrc; img.draggable = false;
  wrapEl.appendChild(img);
  var cv = document.createElement('canvas');
  wrapEl.appendChild(cv);
  function resize() {
    var w=img.offsetWidth, h=img.offsetHeight;
    if(!w||!h) return;
    cv.width=w; cv.height=h;
    var ctx=cv.getContext('2d');
    ctx.lineCap='round'; ctx.lineJoin='round';
    if(v[ik]) { var pi=new Image(); pi.onload=function(){ ctx.drawImage(pi,0,0,w,h); }; pi.src=v[ik]; }
  }
  img.onload=resize;
  if(img.complete&&img.naturalWidth) setTimeout(resize,30);
  window.addEventListener('resize',resize);
  var drawing=false, lx=0, ly=0;
  function gp(e) {
    var r=cv.getBoundingClientRect(), scx=cv.width/r.width, scy=cv.height/r.height;
    var s=e.touches?e.touches[0]:e;
    return [(s.clientX-r.left)*scx,(s.clientY-r.top)*scy];
  }
  function sd(e) {
    e.preventDefault(); drawing=true;
    var ctx2=cv.getContext('2d');
    activeHead={el:cv,ctx:ctx2,v:v,ik:ik,hk:hk};
    document.querySelectorAll('.hwrap').forEach(function(w){ w.classList.remove('act'); });
    wrapEl.classList.add('act');
    document.getElementById('dhint').textContent='✏ 描画中';
    if(!v[hk]) v[hk]=[];
    v[hk]=v[hk].slice(-19); v[hk].push(cv.toDataURL());
    var p=gp(e); lx=p[0]; ly=p[1];
  }
  function dr(e) {
    if(!drawing) return; e.preventDefault();
    var ctx2=cv.getContext('2d'), p=gp(e), x=p[0], y=p[1];
    ctx2.globalCompositeOperation=erasing?'destination-out':'source-over';
    ctx2.strokeStyle=erasing?'rgba(0,0,0,1)':pColor;
    ctx2.lineWidth=erasing?pSz*5:pSz;
    ctx2.beginPath(); ctx2.moveTo(lx,ly); ctx2.lineTo(x,y); ctx2.stroke();
    lx=x; ly=y;
  }
  function ed() {
    if(!drawing) return; drawing=false;
    v[ik]=cv.toDataURL(); scheduleSave();
  }
  cv.addEventListener('mousedown',sd); cv.addEventListener('mousemove',dr);
  cv.addEventListener('mouseup',ed); cv.addEventListener('mouseleave',ed);
  cv.addEventListener('touchstart',sd,{passive:false});
  cv.addEventListener('touchmove',dr,{passive:false});
  cv.addEventListener('touchend',ed);
}

function makeHeads(v) {
  var wrap = document.createElement('div');
  wrap.className = 'heads';
  [['iF','hF','正面',IMG_F],['iS','hS','側面',IMG_S],['iB','hB','後頭部',IMG_B]].forEach(function(item){
    var d = document.createElement('div');
    var hw = document.createElement('div'); hw.className='hwrap';
    var lbl = document.createElement('div'); lbl.className='hlbl'; lbl.textContent=item[2];
    d.appendChild(hw); d.appendChild(lbl);
    wrap.appendChild(d);
    setTimeout(function(){ initHead(hw,item[3],v,item[0],item[1]); },50);
  });
  return wrap;
}

function today() {
  var d=new Date();
  return d.getFullYear()+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0');
}

function makeVisit(c, vi) {
  ensureV(c,vi);
  var v=c.visits[vi], cid=c.id;
  function gv(f){ return v[f]||''; }
  function vm(m){ return v.menu&&v.menu[m]; }
  function vr(f,val,def){ return v[f]===val||(v[f]==null&&val===def); }

  var outer=document.createElement('div');
  outer.style.cssText='display:flex;gap:0;min-width:0';

  var inner=document.createElement('div');
  inner.style.cssText='flex:1;min-width:0';
