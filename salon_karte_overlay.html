<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>Salon de SOAN — 電子カルテ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#c8c5be;min-height:100vh;-webkit-tap-highlight-color:transparent}
.nav{background:#1a1a1a;color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;height:52px;position:fixed;top:0;left:0;right:0;z-index:300}
.nav-title{font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.nav-sep{flex:1}
.nb{padding:6px 11px;border-radius:7px;border:1px solid #555;background:transparent;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.nb:active{background:#333}
.nb.pri{background:#fff;color:#1a1a1a;border-color:#fff;font-weight:700}
.nb.sync{background:#1a6fa8;border-color:#1a6fa8}
.toolbar{background:#222;display:flex;align-items:center;gap:6px;padding:0 12px;height:46px;position:fixed;top:52px;left:0;right:0;z-index:290;overflow-x:auto;-webkit-overflow-scrolling:touch}
.toolbar::-webkit-scrollbar{display:none}
.cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0}
.cdot.on{border-color:#fff}
.tbtn{padding:5px 10px;border-radius:14px;border:1px solid #555;background:transparent;color:#aaa;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.tbtn.on{background:#fff;color:#111;border-color:#fff;font-weight:700}
.tb-sep{width:1px;height:22px;background:#444;flex-shrink:0;margin:0 2px}
.custbar{background:#efece7;border-bottom:1px solid #c5c1b8;padding:0 12px;height:44px;display:flex;align-items:center;gap:8px;position:fixed;top:98px;left:0;right:0;z-index:280;overflow-x:auto;-webkit-overflow-scrolling:touch}
.custbar::-webkit-scrollbar{display:none}
.sq{padding:6px 11px;border:1px solid #bbb;border-radius:16px;font-size:13px;font-family:inherit;outline:none;background:#fff;flex-shrink:0;width:150px}
.cpill{padding:5px 13px;border-radius:16px;border:1px solid #ccc;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cpill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.cpill.alg{border-color:#c0392b;color:#c0392b}
.cpill.on.alg{background:#c0392b;color:#fff;border-color:#c0392b}
.main{margin-top:142px;padding:12px;display:flex;flex-direction:column;gap:12px}
.kcard{background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden}
.kcard-hdr{background:#1a1a1a;color:#fff;font-size:11px;font-weight:700;padding:6px 12px;display:flex;align-items:center;justify-content:space-between}
.kcard-btns{display:flex;gap:6px}
.kcbtn{padding:3px 9px;border-radius:10px;border:1px solid #555;background:transparent;color:#ccc;font-size:10px;cursor:pointer;font-family:inherit}
/* ページラッパー - PDFを背景に入力欄を重ねる */
.page-wrap{position:relative;width:100%;-webkit-user-select:none;user-select:none}
.page-wrap img.bg{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.page-wrap canvas.ink{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;z-index:10}
.page-wrap canvas.ink.draw-mode{cursor:crosshair}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5}
.overlay input[type=text],.overlay input[type=tel],.overlay input[type=email],.overlay input[type=number],.overlay textarea{z-index:6;position:absolute}
.overlay input[type=checkbox],.overlay input[type=radio]{z-index:6;position:absolute}
/* 描画モード時は入力不可 */
.draw-active .overlay{pointer-events:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:12px;padding:8px 18px;border-radius:20px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.empty{padding:60px 20px;text-align:center;color:#aaa;font-size:14px;line-height:2.2}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.md{background:#fff;border-radius:14px;width:100%;max-width:440px;padding:20px;max-height:90vh;overflow-y:auto}
.md h2{font-size:16px;font-weight:700;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.fc{grid-column:1/-1}
.fl{font-size:11px;color:#888;margin-bottom:3px;display:block}
.fi{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:7px;font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none}
.fi:focus{border-color:#888}
.ma{display:flex;gap:8px;margin-top:14px}
.bc{flex:1;padding:11px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.bs{flex:2;padding:11px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.setup-box{background:#fff;border-radius:10px;padding:20px;max-width:480px;margin:10px auto;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.setup-box h3{font-size:15px;font-weight:700;margin-bottom:10px}
.hint{background:#fffbe6;border:1px solid #e8d050;border-radius:8px;padding:10px 14px;font-size:12px;color:#666;line-height:1.7;margin-bottom:10px}
.step{display:flex;gap:8px;margin-bottom:8px;font-size:12px;color:#444;line-height:1.6}
.step-num{background:#1a1a1a;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
/* 描画モードトグル */
.draw-toggle{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;border:1px solid #555;background:transparent;color:#aaa;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.draw-toggle.on{background:#e8a020;color:#fff;border-color:#e8a020;font-weight:700}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-title">✦ Salon de SOAN｜電子カルテ</div>
  <div class="nav-sep"></div>
  <button class="nb sync" id="btn-sync" onclick="syncNow()" style="display:none">☁ 同期</button>
  <button class="nb pri" onclick="openNewCust()" id="btn-newcust" style="display:none">＋新規顧客</button>
  <button class="nb pri" onclick="showSetup()" id="btn-setup">⚙ 初期設定</button>
</div>

<div class="toolbar" id="toolbar" style="display:none">
  <button class="draw-toggle" id="btn-draw" onclick="toggleDrawMode()">✏ 描画モード OFF</button>
  <div class="tb-sep"></div>
  <div class="cdot on" style="background:#111" data-c="#111" onclick="setC(this)"></div>
  <div class="cdot" style="background:#c0392b" data-c="#c0392b" onclick="setC(this)"></div>
  <div class="cdot" style="background:#1a6fa8" data-c="#1a6fa8" onclick="setC(this)"></div>
  <div class="cdot" style="background:#1e8449" data-c="#1e8449" onclick="setC(this)"></div>
  <div class="cdot" style="background:#d68910" data-c="#d68910" onclick="setC(this)"></div>
  <div class="tb-sep"></div>
  <button class="tbtn" id="btn-er" onclick="toggleEr()">消しゴム</button>
  <span style="font-size:11px;color:#777;flex-shrink:0">太さ</span>
  <input type="range" min="1" max="20" value="2" step="1" oninput="pSz=+this.value" style="width:70px;flex-shrink:0;accent-color:#fff;cursor:pointer">
  <div class="tb-sep"></div>
  <button class="tbtn" onclick="doUndo()">↩ 戻す</button>
  <button class="tbtn" onclick="doClear()">🗑 クリア</button>
</div>

<div class="custbar" id="custbar" style="display:none">
  <input class="sq" type="text" id="sq" placeholder="🔍 名前・電話で検索" oninput="doSearch()">
  <div id="pills" style="display:flex;gap:6px;flex-shrink:0"></div>
</div>

<div class="main" id="main">
  <div id="setup-area"></div>
  <div class="empty" id="empty" style="display:none">✦<br>顧客を選択するか、新規顧客を登録してください<br>
    <button class="nb pri" onclick="openNewCust()" style="margin-top:14px;padding:10px 20px;font-size:13px">＋ 新規顧客登録</button>
  </div>
  <div id="karea" style="display:none;flex-direction:column;gap:12px"></div>
</div>
<div class="toast" id="toast"></div>
<div id="mroot"></div>

// PDFサイズ(pt)
const PW = 841.9, PH = 595.3;
function px(x){ return (x/PW*100).toFixed(3)+'%'; }
function py(y){ return (y/PH*100).toFixed(3)+'%'; }
function pw(w){ return (w/PW*100).toFixed(3)+'%'; }
function ph(h){ return (h/PH*100).toFixed(3)+'%'; }

const GAS_KEY='soan_gas_v5';
let GAS_URL=localStorage.getItem(GAS_KEY)||'';
let pColor='#111',pSz=2,erasing=false,drawMode=false;
let curId=null,activeCv=null;
let db={customers:[],nid:1};
let syncTimer=null;

function toast(msg,dur=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),dur);
}
async function gasReq(action,payload={}){
  if(!GAS_URL)return null;
  try{const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action,...payload})});return await res.json();}
  catch(e){return null;}
}
async function loadCloud(){
  toast('☁ 読み込み中...',4000);
  const res=await gasReq('load');
  if(res&&res.ok&&res.data){db=res.data;toast('✅ 読み込みました');}
  else{loadLocal();toast('⚠ ローカルデータを使用');}
  renderPills();
}
async function saveCloud(){
  saveLocal();
  if(!GAS_URL)return;
  const res=await gasReq('save',{data:db});
  if(res&&res.ok)toast('✅ クラウドに保存しました');
  else toast('⚠ クラウド保存失敗（ローカル保存済み）');
}
function scheduleSave(){clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,2000);}
function syncNow(){saveCloud();}
function saveLocal(){
  try{
    const slim={...db,customers:db.customers.map(c=>{
      const c2={...c};
      if(c2.p1ink)c2.p1ink='';
      if(c2.p2ink)c2.p2ink='';
      if(c2.p1hist)c2.p1hist=[];
      if(c2.p2hist)c2.p2hist=[];
      return c2;
    })};
    localStorage.setItem('soan_v5',JSON.stringify(slim));
  }catch(e){}
}
function loadLocal(){
  try{const s=localStorage.getItem('soan_v5');if(s)db=JSON.parse(s);}catch(e){}
}
function gc(id){return db.customers.find(c=>c.id===id);}
function doSearch(){renderPills(document.getElementById('sq').value.trim().toLowerCase());}
function renderPills(q=''){
  let list=db.customers;
  if(q)list=list.filter(c=>c.name.toLowerCase().includes(q)||(c.tel||'').replace(/-/g,'').includes(q.replace(/-/g,'')));
  document.getElementById('pills').innerHTML=list.map(c=>
    `<span class="cpill${c.id===curId?' on':''}${c.allergy?' alg':''}" onclick="selCust(${c.id})">${c.name}</span>`
  ).join('');
}
function selCust(id){curId=id;activeCv=null;renderPills(document.getElementById('sq').value.trim().toLowerCase());renderKarte();}

// ===== 描画モード =====
function toggleDrawMode(){
  drawMode=!drawMode;
  const btn=document.getElementById('btn-draw');
  btn.classList.toggle('on',drawMode);
  btn.textContent=drawMode?'✏ 描画モード ON（タップで描く）':'✏ 描画モード OFF';
  document.querySelectorAll('.page-wrap').forEach(w=>w.classList.toggle('draw-active',drawMode));
  document.querySelectorAll('canvas.ink').forEach(cv=>cv.classList.toggle('draw-mode',drawMode));
  toast(drawMode?'描画モード ON — カルテに直接描けます':'描画モード OFF — 入力モードに戻りました');
}
function setC(dot){
  erasing=false;document.getElementById('btn-er').classList.remove('on');
  pColor=dot.dataset.c;
  document.querySelectorAll('.cdot').forEach(d=>d.classList.remove('on'));
  dot.classList.add('on');
}
function toggleEr(){erasing=!erasing;document.getElementById('btn-er').classList.toggle('on',erasing);}
function doUndo(){
  if(!activeCv)return;
  const{el,ctx,c,field}=activeCv;
  const hist=c[field+'hist']||[];
  if(!hist.length)return;
  const prev=hist.pop();
  c[field+'hist']=hist;
  const i=new Image();i.onload=()=>{ctx.clearRect(0,0,el.width,el.height);ctx.drawImage(i,0,0);};i.src=prev;
  c[field]=prev;scheduleSave();
}
function doClear(){
  if(!activeCv)return;
  if(!confirm('このページの書き込みをすべて消しますか？'))return;
  const{el,ctx,c,field}=activeCv;
  if(!c[field+'hist'])c[field+'hist']=[];
  c[field+'hist'].push(el.toDataURL());
  ctx.clearRect(0,0,el.width,el.height);
  c[field]='';scheduleSave();
}

// ===== RENDER =====
function renderKarte(){
  const c=gc(curId);if(!c)return;
  document.getElementById('empty').style.display='none';
  const ka=document.getElementById('karea');
  ka.style.display='flex';
  ka.innerHTML=`
  <div style="background:#fffbe6;border:1px solid #e8d050;border-radius:8px;padding:10px 14px;font-size:12px;color:#555;line-height:1.8">
    💡 <strong>入力モード</strong>：チェックボックス・テキスト入力が使えます。
    <strong>✏ 描画モード</strong>：頭のイラスト部分にヘアスタイルを書き込みます。上のツールバーで切り替えてください。
  </div>`;
  // ページ1
  ka.appendChild(makePage1(c));
  // ページ2
  ka.appendChild(makePage2(c));
}

function makePage1(c){
  const div=document.createElement('div');
  div.className='kcard';
  div.innerHTML=`
  <div class="kcard-hdr">
    <span>表面（基本情報・施術記録①②③）— ${c.name}</span>
    <div class="kcard-btns"><button class="kcbtn" onclick="saveImg('p1cv-${c.id}','bg-p1-${c.id}','${c.name}','表面')">💾 画像保存</button></div>
  </div>
  <div class="page-wrap" id="pw-p1-${c.id}">
    <img class="bg" id="bg-p1-${c.id}" src="${BG.p1}" draggable="false">
    <div class="overlay" id="ol-p1-${c.id}">
      ${overlayP1(c)}
    </div>
    <canvas class="ink" id="p1cv-${c.id}"></canvas>
  </div>`;
  requestAnimationFrame(()=>initCv(div.querySelector('canvas'),c,'p1ink'));
  return div;
}

function makePage2(c){
  const div=document.createElement('div');
  div.className='kcard';
  div.innerHTML=`
  <div class="kcard-hdr">
    <span>裏面（施術記録④⑤・来店履歴）— ${c.name}</span>
    <div class="kcard-btns"><button class="kcbtn" onclick="saveImg('p2cv-${c.id}','bg-p2-${c.id}','${c.name}','裏面')">💾 画像保存</button></div>
  </div>
  <div class="page-wrap" id="pw-p2-${c.id}">
    <img class="bg" id="bg-p2-${c.id}" src="${BG.p2}" draggable="false">
    <div class="overlay" id="ol-p2-${c.id}">
      ${overlayP2(c)}
    </div>
    <canvas class="ink" id="p2cv-${c.id}"></canvas>
  </div>`;
  requestAnimationFrame(()=>initCv(div.querySelector('canvas'),c,'p2ink'));
  return div;
}

// ===== OVERLAY P1: PDFの座標に合わせて入力欄を配置 =====
function overlayP1(c){
  const cid=c.id;
  const sf=`saveF(${cid},'`;

  // ラジオボタンヘルパー
  function radio(name,field,opts,cur){
    return opts.map(([val,lx,ly])=>
      `<input type="radio" name="${name}-${cid}" value="${val}" ${c[field]===val||(!c[field]&&opts[0][0]===val)?'checked':''}
       style="left:${lx};top:${ly};${RAD}" onchange="saveF(${cid},'${field}',this.value)">`
    ).join('');
  }
  function chk(field,m,lx,ly){
    const v=c.visits&&c.visits[0]&&c.visits[0].menu&&c.visits[0].menu[m];
    return `<input type="checkbox" ${v?'checked':''} style="left:${lx};top:${ly};${CHK}" onchange="saveVM(${cid},0,'${m}',this.checked)">`;
  }
  function inp(field,lx,ly,lw,lh,ph='',tp='text'){
    return `<input type="${tp}" value="${c[field]||''}" placeholder="${ph}"
      style="left:${lx};top:${ly};width:${lw};height:${lh};${INP}"
      onchange="saveF(${cid},'${field}',this.value)">`;
  }
  function vinp(vi,field,lx,ly,lw,lh,ph='',tp='text'){
    const v=c.visits&&c.visits[vi];
    const val=v&&v[field]||'';
    return `<input type="${tp}" value="${val}" placeholder="${ph}"
      style="left:${lx};top:${ly};width:${lw};height:${lh};${INP}"
      onchange="saveV(${cid},${vi},'${field}',this.value)">`;
  }
  function vchk(vi,m,lx,ly){
    const v=c.visits&&c.visits[vi];
    const checked=v&&v.menu&&v.menu[m]?'checked':'';
    return `<input type="checkbox" ${checked} style="left:${lx};top:${ly};${CHK}" onchange="saveVM(${cid},${vi},'${m}',this.checked)">`;
  }
  function vrad(vi,field,val,lx,ly){
    const v=c.visits&&c.visits[vi];
    const cur=v&&v[field]||'';
    const checked=cur===val||(!cur&&val==='無')?'checked':'';
    return `<input type="radio" name="${field}-v${vi}-${cid}" value="${val}" ${checked}
      style="left:${lx};top:${ly};${RAD}" onchange="saveV(${cid},${vi},'${field}',this.value)">`;
  }

  return `
    <!-- フリガナ -->
    ${inp('kana', px(197), py(62), pw(215), ph(10), 'フリガナ')}
    <!-- No -->
    ${inp('no', px(36), py(81), pw(115), ph(12), '001')}
    <!-- Name -->
    ${inp('name', px(190), py(81), pw(210), ph(12), '山田 花子')}
    <!-- Address -->
    ${inp('addr', px(85), py(115), pw(315), ph(12))}
    <!-- Tel -->
    ${inp('tel', px(55), py(143), pw(345), ph(12), '090-0000-0000', 'tel')}
    <!-- Mail -->
    ${inp('mail', px(55), py(171), pw(345), ph(12), 'mail@example.com', 'email')}
    <!-- Birthday 年 -->

function initCv(cv,c,field){
  const wrap=cv.closest('.page-wrap');
  const img=wrap.querySelector('img.bg');
  if(!cv||!img)return;
  function resize(){
    const w=img.offsetWidth,h=img.offsetHeight;
    if(!w||!h)return;
    const prev=c[field]||null;
    cv.width=w;cv.height=h;
    const ctx=cv.getContext('2d');
    ctx.lineCap='round';ctx.lineJoin='round';
    if(prev){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0,w,h);i.src=prev;}
  }
  if(img.complete&&img.naturalWidth)resize();else img.onload=resize;
  window.addEventListener('resize',resize);

  let drawing=false,lx=0,ly=0;
  const ctx=()=>cv.getContext('2d');
  function gp(e){
    const r=cv.getBoundingClientRect(),scx=cv.width/r.width,scy=cv.height/r.height;
    const s=e.touches?e.touches[0]:e;
    return[(s.clientX-r.left)*scx,(s.clientY-r.top)*scy];
  }
  function startDraw(e){
    if(!drawMode)return;
    e.preventDefault();drawing=true;
    activeCv={el:cv,ctx:ctx(),c,field};
    if(!c[field+'hist'])c[field+'hist']=[];
    c[field+'hist']=c[field+'hist'].slice(-19);
    c[field+'hist'].push(cv.toDataURL());
    [lx,ly]=gp(e);
  }
  function moveDraw(e){
    if(!drawing||!drawMode)return;e.preventDefault();
    const[x,y]=gp(e),c2=ctx();
    c2.globalCompositeOperation=erasing?'destination-out':'source-over';
    c2.strokeStyle=erasing?'rgba(0,0,0,1)':pColor;
    c2.lineWidth=erasing?pSz*6:pSz;
    c2.beginPath();c2.moveTo(lx,ly);c2.lineTo(x,y);c2.stroke();
    [lx,ly]=[x,y];
  }
  function endDraw(){
    if(!drawing)return;drawing=false;
    c[field]=cv.toDataURL();scheduleSave();
  }
  cv.addEventListener('mousedown',startDraw);
  cv.addEventListener('mousemove',moveDraw);
  cv.addEventListener('mouseup',endDraw);
  cv.addEventListener('mouseleave',endDraw);
  cv.addEventListener('touchstart',startDraw,{passive:false});
  cv.addEventListener('touchmove',moveDraw,{passive:false});
  cv.addEventListener('touchend',endDraw);
}

function ensureVisits(c,vi){
  if(!c.visits)c.visits=[];
  while(c.visits.length<=vi)c.visits.push({menu:{}});
}
function saveF(cid,field,val){const c=gc(cid);if(!c)return;c[field]=val;scheduleSave();}
function saveFMenu(cid,m,val){const c=gc(cid);if(!c)return;if(!c.menu)c.menu={};c.menu[m]=val;scheduleSave();}
function saveV(cid,vi,field,val){const c=gc(cid);if(!c)return;ensureVisits(c,vi);c.visits[vi][field]=val;scheduleSave();}
function saveVM(cid,vi,m,val){const c=gc(cid);if(!c)return;ensureVisits(c,vi);if(!c.visits[vi].menu)c.visits[vi].menu={};c.visits[vi].menu[m]=val;scheduleSave();}

function saveImg(cvId,bgId,name,label){
  const cv=document.getElementById(cvId);
  const bg=document.getElementById(bgId);
  if(!cv||!bg)return;
  const merged=document.createElement('canvas');
  merged.width=cv.width;merged.height=cv.height;
  const ctx=merged.getContext('2d');
  const bgI=new Image();
  bgI.onload=()=>{
    ctx.drawImage(bgI,0,0,merged.width,merged.height);
    ctx.drawImage(cv,0,0);
    const a=document.createElement('a');
    const d=new Date().toLocaleDateString('ja-JP').replace(/\//g,'');
    a.href=merged.toDataURL('image/jpeg',0.92);
    a.download=`${name}_カルテ${label}_${d}.jpg`;
    a.click();toast('💾 画像保存しました');
  };
  bgI.src=bg.src;
}

const GAS_CODE=`const FILE_NAME = 'SalonKarte_Data.json';
function doPost(e) {
  const data = JSON.parse(e.postData.contents);
  if (data.action === 'save') return reply(saveData(data.data));
  if (data.action === 'load') return reply(loadData());
  return reply({ok:false});
}
function doGet() { return reply({ok:true}); }
function reply(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
function saveData(db) {
  try {
    const files = DriveApp.getRootFolder().getFilesByName(FILE_NAME);
    const json = JSON.stringify(db);
    if (files.hasNext()) { files.next().setContent(json); }
    else { DriveApp.getRootFolder().createFile(FILE_NAME, json, MimeType.PLAIN_TEXT); }
    return {ok:true};
  } catch(e) { return {ok:false,error:e.toString()}; }
}
function loadData() {
  try {
    const files = DriveApp.getRootFolder().getFilesByName(FILE_NAME);
    if (files.hasNext()) { return {ok:true,data:JSON.parse(files.next().getBlob().getDataAsString())}; }
    return {ok:true,data:null};
  } catch(e) { return {ok:false,error:e.toString()}; }
}`;
